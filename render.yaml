services:
  - type: web
    name: mirage-app
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
      # Add your environment variables here
      # - key: DIFY_API_KEY
      #   sync: false  # Set this in Render dashboard for security
    buildFilter:
      paths:
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - "package.json"
        - "pnpm-lock.yaml"
        - "Dockerfile"
        - ".dockerignore"
      ignoredPaths:
        - ".env"
        - ".env.*"
        - "*.log"
        - ".next/**"
        - "node_modules/**"
